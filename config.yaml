  - name: 물 만난 약사
    naver_id: funfun_seoki

# 세션 쿠키 보관 위치 (리포지토리 밖 — 공개 리포에 자격증명이 들어가면 안 된다)
profiles_dir: "../profiles"

# 허브 페이지 최상단 콜아웃에 마지막 실행 상태를 기록 (NOTION_TOKEN 있을 때만)
notion:
  hub_page_id: "3b239eba97ed80afb476ea4f792ddf1b"

# 클립 단위 상세 지표(유입처·연령성별)를 받아올 최대 개수 — 최근 것부터
clip_detail_limit: 60

login:
  # 자동 재로그인은 창을 띄워서 한다. 헤드리스로 하면 네이버가 캡차를 건다(실측).
  # 05:00 실행이라 창이 잠깐 떠도 방해되지 않는다.
  # 비밀번호는 macOS 키체인에만 둔다:
  #   security add-generic-password -s naver-clip -a <네이버ID> -w
  headless: false
  # 네이버는 NID_AUT 만료(약 30일)를 사용으로 연장해 주지 않는다.
  # 만료 N일 전부터 선제적으로 재로그인해 끊기는 날이 없게 한다.
  relogin_before_days: 5
